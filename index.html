    const playHapticAudio = (type = 'click') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(850, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'success') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.04, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.22);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.22);
          });
        } else if (type === 'alert') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(980, now + 0.1);
          osc.frequency.setValueAtTime(520, now + 0.2);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'scan') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(1500, now + 0.22);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

    // ========================================================
    // 3. ANIMATED NUMBER COUNTER (Cinematic Smooth Entrance)
    // ========================================================
    const AnimatedCounter = ({ target, duration = 1200, prefix = "", suffix = "" }) => {
      const [count, setCount] = useState(0);

      useEffect(() => {
        let startTime = null;
        let animationFrameId;

        const animate = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const easedProgress = 1 - Math.pow(1 - progress, 3);
          setCount(Math.floor(easedProgress * target));

          if (progress < 1) {
            animationFrameId = requestAnimationFrame(animate);
          } else {
            setCount(target);
          }
        };

        animationFrameId = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationFrameId);
      }, [target, duration]);

      return <span>{prefix}{count.toLocaleString()}{suffix}</span>;
    };

    // ========================================================

    const SlaCountdownTimer = ({ initialHours = 2 }) => {
      const [secondsLeft, setSecondsLeft] = useState(initialHours * 3600 - 1240);

      useEffect(() => {
        const timer = setInterval(() => {
          setSecondsLeft(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);

      { code: 'mr', name: 'Marathi', native: 'मराठी' },
    ];

    const analyzeComplaintWithAI = (text, userAddress, userImage) => {
      const lower = text.toLowerCase();

      let categoryId = 'roads';
      let confidence = 88.5;

      if (lower.includes('wire') || lower.includes('electric') || lower.includes('spark') || lower.includes('current') || lower.includes('pole') || lower.includes('transformer') || lower.includes('बिजली') || lower.includes('ವಿದ್ಯುತ್') || lower.includes('மின்சாரம்')) {
        categoryId = 'electricity';
        confidence = 98.2;
      } else if (lower.includes('manhole') || lower.includes('drain') || lower.includes('sewer') || lower.includes('gutter') || lower.includes('flood') || lower.includes('नाली') || lower.includes('ಚರಂಡಿ') || lower.includes('சாக்கடை')) {
        categoryId = 'drainage';
        confidence = 97.4;
      } else if (lower.includes('water') || lower.includes('pipeline') || lower.includes('tap') || lower.includes('drinking') || lower.includes('burst') || lower.includes('पानी') || lower.includes('ನೀರು') || lower.includes('தண்ணீர்')) {
        categoryId = 'water';
        confidence = 96.6;
      } else if (lower.includes('garbage') || lower.includes('waste') || lower.includes('dump') || lower.includes('trash') || lower.includes('sludge') || lower.includes('कचरा') || lower.includes('ತ್ಯಾಜ್ಯ') || lower.includes('குப்பை')) {
        categoryId = 'waste';
        confidence = 95.8;
      } else if (lower.includes('tree') || lower.includes('branch') || lower.includes('forest') || lower.includes('falling') || lower.includes('पेड़') || lower.includes('ಮರ') || lower.includes('மரம்')) {
        categoryId = 'trees';
        confidence = 94.9;
      } else if (lower.includes('signal') || lower.includes('safety') || lower.includes('hazard') || lower.includes('accident') || lower.includes('collapse')) {
        categoryId = 'safety';
        confidence = 93.5;
      } else if (lower.includes('pothole') || lower.includes('road') || lower.includes('asphalt') || lower.includes('pavement') || lower.includes('crater') || lower.includes('सड़क') || lower.includes('ರಸ್ತೆ') || lower.includes('சாலை')) {
        categoryId = 'roads';
        confidence = 95.0;
      }

      const catObj = CATEGORIES.find(c => c.id === categoryId) || CATEGORIES[0];

      let severity = 'Medium';
      let hazardReason = 'Standard municipal maintenance issue with moderate localized impact.';
      let triggers = [];

      const criticalTerms = ['live wire', 'sparking', 'open manhole', 'school', 'hospital', 'fatal', 'accident', 'children', 'poison', 'emergency', 'electric', 'submerged', 'current', 'विद्युत', 'உயிர் ஆபத்து'];
      const highTerms = ['pothole', 'flyover', 'burst', 'arterial', 'underpass', 'toxic', 'gridlock', 'jam', 'signal down', 'huge', 'deep'];

      const matchesCritical = criticalTerms.filter(t => lower.includes(t));
      const matchesHigh = highTerms.filter(t => lower.includes(t));

      if (matchesCritical.length > 0) {
        severity = 'Critical';
        triggers = matchesCritical;
        hazardReason = `High hazard detected (${matchesCritical.join(', ')}). Imminent danger to pedestrian or vehicular safety requiring immediate dispatch within 2 hours.`;
      } else if (matchesHigh.length > 0) {
        severity = 'High';
        triggers = matchesHigh;
        hazardReason = `Substantial public infrastructure disruption (${matchesHigh.join(', ')}). High traffic or sanitation failure requiring 12-hour resolution.`;
      } else if (lower.length > 120) {
        severity = 'Medium';
        triggers = ['multi-point report', 'structural impairment'];
        hazardReason = 'Moderate localized impairment requiring scheduled departmental intervention within 36 hours.';
      } else {
        severity = 'Low';
        triggers = ['routine upkeep'];
        hazardReason = 'Non-hazardous municipal maintenance task assigned to standard routine queue.';
      }

      let impactScore = 55;
      if (severity === 'Critical') impactScore = Math.floor(88 + Math.random() * 10);
      else if (severity === 'High') impactScore = Math.floor(70 + Math.random() * 15);
      else if (severity === 'Medium') impactScore = Math.floor(45 + Math.random() * 20);
      else impactScore = Math.floor(25 + Math.random() * 15);

      const impactPopulation = impactScore * (severity === 'Critical' ? 45 : 25) + 350;
      const generatedSummary = `AI Triage: Verified report classified under ${catObj.name}. Evaluated as ${severity} priority due to ${hazardReason.slice(0, 80)}... Field dispatch ticket generated for ${catObj.dept}.`;

      const cvDetections = [
        { label: `AI Identified: ${catObj.name} Defect`, conf: (confidence / 100).toFixed(2), box: [25, 30, 50, 45], color: severity === 'Critical' ? '#EF4444' : '#06B6D4' }
      ];

      return {
        category: catObj.name,
        categoryId: catObj.id,
        severity,
        department: catObj.dept,
        confidence,
        summary: generatedSummary,
        hazardReason,
        triggers,
        impactScore,
        impactPopulation,
        cvDetections,
        slaHours: SEVERITY_CONFIG[severity].slaHours
      };
    };

              </div>
            </div>
          `;

          marker.bindPopup(popupContent);

          });

          markersRef.current[item.id] = marker;
        });

      useEffect(() => {

            c.category.toLowerCase().includes(q) ||
            c.severity.toLowerCase().includes(q) ||

            c.status.toLowerCase().includes(q)

            return (b.impactScore || 0) - (a.impactScore || 0);

            return a.ward.localeCompare(b.ward);

            triggerSound('click');

            citizenPhone: citizenPhone || '+91 9XXXX-XXXXX',

    const CivicCopilotDrawer = ({ complaints, onClose, onSelectTicket, triggerSound }) => {
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: 'Hello, Commander. I am your **CivicLens AI Municipal Copilot**. I have analyzed all active municipal telemetry, geospatial clusters, and department field allocations. How can I assist your dispatch operations today?'
        }
      ]);
      const [input, setInput] = useState('');
      const [isThinking, setIsThinking] = useState(false);

      const quickPrompts = [
        "🚨 What are the top critical emergencies right now?",
        "📊 Which department has the worst backlog?",
        "⚡ Draft dispatch order for live wire in Indiranagar",
        "🔍 Find duplicate clusters in Koramangala",
        "⚠️ Which tickets require immediate escalation?"
      ];

      const handleSendMessage = (textToSend) => {
        const query = textToSend || input;
        if (!query.trim()) return;

        triggerSound('click');
        const userMsg = { id: Date.now(), sender: 'user', text: query };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsThinking(true);

        setTimeout(() => {
          setIsThinking(false);
          triggerSound('scan');

          let reply = "";
          const q = query.toLowerCase();

          if (q.includes('critical') || q.includes('emergency')) {
            const crits = complaints.filter(c => c.severity === 'Critical');
            reply = `Currently, there are **${crits.length} Critical Emergencies** requiring immediate action:\n\n` +
              crits.map(c => `• **${c.id}**: ${c.title} (${c.ward}) - SLA: 2h [Tier ${c.escalationTier || 1}]`).join('\n') +
              `\n\nWould you like me to initiate immediate emergency crew mobilization?`;
          } else if (q.includes('backlog') || q.includes('department')) {
            reply = `**Department Performance & Backlog Analysis**:\n• **PWD**: 14 active backlog tickets (78.4% SLA compliance - Grade B)\n• **SWD (Drainage)**: 11 active backlog tickets (74.0% SLA compliance - Grade C+)\n• **DISCOM**: 8 active backlog tickets (92.1% SLA compliance - Grade A)\n• **SWM**: 7 active backlog tickets (95.2% SLA compliance - Grade A+)\n\n**Recommendation**: SWD and PWD are the primary operational bottlenecks due to seasonal monsoon road degradation.`;
          } else if (q.includes('escalat')) {
            reply = `**Smart Escalation Candidate Identified**:\n• **CVX-2026-1042** (Indiranagar Live Wire): Approaching SLA deadline with 800 school students in 40m proximity.\n• Recommended Action: Escalate immediately to Tier 2 (Zonal Superintendent). Click the ticket to trigger automated alert.`;
          } else if (q.includes('live wire') || q.includes('indiranagar')) {
            reply = `**Dispatch Brief Draft for CVX-2026-1042**:\n• **Assigned Unit**: DISCOM Emergency Feeder Unit\n• **Hazard**: 11kV live power cable severed across school pedestrian gate\n• **Required Action**: Immediate remote breaker trip on Feeder Line 4B, followed by 4-man lineman rewiring team.\n• **Required Materials**: Copper Splice Clamps, HT Insulation Sleeve\n• **SLA Target**: Under 90 minutes.`;
          } else if (q.includes('duplicate') || q.includes('cluster')) {
            reply = `**Incident Cluster Diagnosis**:\n• Identified **3 Major Active Clusters** encompassing 18 citizen reports.\n• Largest cluster is at **Marathahalli Underpass** (6 duplicate reports, ~35,000 citizens impacted).\n• Consolidated master ticket: **CVX-2026-1035**.`;
          } else {
            reply = `I have cross-referenced your query against the live municipal database. All active complaints are continuously triaged using multimodal NLP, computer vision bounding boxes, and SLA escalation rules. You can switch to the **Duplicate Hub** or **Department Analytics** tabs to explore deeper.`;
          }

          setMessages(prev => [...prev, { id: Date.now() + 1, sender: 'ai', text: reply }]);
        }, 800);
      };

      return (
        <div className="fixed inset-y-0 right-0 z-50 w-full max-w-md glass-card border-l border-slate-700 p-4 flex flex-col shadow-2xl animate-fadeIn">
          <div className="flex items-center justify-between pb-3 border-b border-slate-800">

              <Icon name="send" size={16} />
            </button>
          </div>
        </div>
      );
    };

    // ========================================================
    // 16. AMBIENT CANVAS PARTICLES WITH VISIBILITY PAUSE
    // ========================================================
    const initAmbientParticles = () => {
      const canvas = document.getElementById('ambient-cyber-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particleCount = 42;
      const particles = [];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          size: Math.random() * 1.8 + 0.8,
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      let animId = null;

      const render = () => {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particleCount; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(6, 182, 212, ${p.alpha})`;
          ctx.fill();

          for (let j = i + 1; j < particleCount; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / 110) * 0.12})`;
              ctx.lineWidth = 0.7;
              ctx.stroke();
            }
          }
        }

        animId = requestAnimationFrame(render);
      };

      // Pause when tab hidden to save battery & CPU
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
        } else {
          animId = requestAnimationFrame(render);
        }
      });

      render();
    };

    setTimeout(initAmbientParticles, 100);
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<CivicLensApp />);
  </script>
</body>
</html>
